# engine/extract/patterns.yaml: how each tool shows itself in a captured bundle
# (docs/PLAN.md Step 38). Read by engine/extract/stack.py (stack_signals),
# dns.py (spf_senders "tools") and forms.py (has_booking_step).
#
# One entry per tool. A wrong pattern is a one-line fix here and a version bump
# below; nothing else in the code names a tool's host.
#
# Keys (all optional except id, name, category):
#   script_hosts   host, or host/path-prefix, of a <script src> or <iframe src>
#                  on any captured page. Matches the host itself or any
#                  subdomain of it ("hs-scripts.com" matches js.hs-scripts.com).
#   link_hosts     host, or host/path-prefix, of a link, iframe or form action.
#                  Keep these specific: a link to a vendor's homepage is not use.
#   txt_prefixes   start of a TXT record on the company's root domain
#                  (verification records), compared case-insensitively.
#   spf_includes   domain in an SPF include: on the root (same subdomain rule).
#   mx_hosts       an MX host of the root (same subdomain rule).
#   cname_targets  the target of a CNAME on a checked sending subdomain.
#   cookies        cookie names the tool sets. Documentation only: capture does
#                  not keep response headers, so no fact reads these (ex-1.1).
#
# Categories: crm, marketing_automation, chat, scheduling, analytics,
# sales_engagement, email_sending, email_hosting, visitor_identification,
# ads, forms.
#
# A tool listed with no pattern has no public footprint we are confident of;
# it is kept so the coverage is visible. Add a pattern only when you have seen
# it on a real bundle.
#
# Changing anything here bumps version; `te extract facts` then rewrites the
# facts of every company whose output changes.

version: pat-1.0

tools:
  # -- email hosting and sending --------------------------------------------------
  - id: google_workspace
    name: Google Workspace
    category: email_hosting
    spf_includes: [_spf.google.com]
    mx_hosts: [google.com, googlemail.com]
  - id: microsoft_365
    name: Microsoft 365
    category: email_hosting
    spf_includes: [spf.protection.outlook.com]
    mx_hosts: [mail.protection.outlook.com]
    txt_prefixes: ["MS=ms"]
  - id: zoho_mail
    name: Zoho Mail
    category: email_hosting
    spf_includes: [zoho.com, zoho.in, zoho.eu, zohomail.com, zohomail.in]
    mx_hosts: [zoho.com, zoho.in, zoho.eu]
    txt_prefixes: ["zoho-verification="]
  - id: amazon_ses
    name: Amazon SES
    category: email_sending
    spf_includes: [amazonses.com]
    cname_targets: [amazonses.com]
  - id: sendgrid
    name: SendGrid
    category: email_sending
    spf_includes: [sendgrid.net]
    mx_hosts: [sendgrid.net]
    cname_targets: [sendgrid.net]
  - id: mailgun
    name: Mailgun
    category: email_sending
    spf_includes: [mailgun.org]
    mx_hosts: [mailgun.org]
    cname_targets: [mailgun.org]
  - id: postmark
    name: Postmark
    category: email_sending
    spf_includes: [mtasv.net]
    cname_targets: [mtasv.net]
  - id: mailchimp
    name: Mailchimp
    category: marketing_automation
    spf_includes: [servers.mcsv.net]
    cname_targets: [mcsv.net]
    script_hosts: [chimpstatic.com]
    link_hosts: [list-manage.com]
  - id: mandrill
    name: Mandrill
    category: email_sending
    spf_includes: [spf.mandrillapp.com]
    cname_targets: [mandrillapp.com]
    txt_prefixes: ["mandrill_verify."]
  - id: brevo
    name: Brevo (Sendinblue)
    category: marketing_automation
    spf_includes: [spf.sendinblue.com, spf.brevo.com]
    txt_prefixes: ["sendinblue-code:", "brevo-code:"]
    script_hosts: [sibautomation.com]
    link_hosts: [sibforms.com]

